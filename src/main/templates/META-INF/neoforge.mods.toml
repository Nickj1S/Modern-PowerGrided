modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

# --- Dependencies ---

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.9,6.1.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "powergrid"
type = "required"
versionRange = "[0.6.1,)"
ordering = "AFTER"
side = "BOTH"

# Optional: MI supplies the ingot/dust items used as machine recipe I/O.
[[dependencies."${mod_id}"]]
modId = "modern_industrialization"
type = "optional"
versionRange = "[2.5,)"
ordering = "AFTER"
side = "BOTH"
